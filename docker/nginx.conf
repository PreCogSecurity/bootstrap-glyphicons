# Minimal, explicit server configuration for the bootstrap-glyphicons preview.
#
# This replaces the stock image config so that nginx can run entirely as the
# unprivileged `nginx` user:
#   - `pid` and every temp/cache path live under /tmp, which is the only
#     writable location when the container runs with a read-only root
#     filesystem (see docker-compose.yml).
#   - Logs go straight to stdout/stderr so `docker compose logs` works and no
#     log file needs to be writable.
#   - The server only ever serves two static files. No CGI, no proxying, no
#     script handlers, so there is nothing here for an attacker to escalate to.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # A static asset server never receives a meaningful request body. Bounding
    # bodies, headers and slow clients removes the cheap resource-exhaustion
    # paths without affecting GET/HEAD for the two shipped file types.
    client_max_body_size 1k;
    large_client_header_buffers 4 8k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 10s;

    # The shipped stylesheets are text; compress them on the wire. Images are
    # already compressed and are deliberately left alone.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;

        # Defence in depth for a file-only server: the browser is told not to
        # guess a content type, the document may not be framed or used as a
        # base URI, and nothing may be loaded from anywhere but this origin.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; base-uri 'none'" always;

        # Never serve dotfiles (.git, .env, editor swap files) even if the
        # document root is ever pointed at a checkout.
        location ~ /\. {
            deny all;
            access_log off;
        }

        # The pack is immutable once published, so let caches hold on to it.
        location ~* \.(css|png)$ {
            expires 1d;
            # Only read methods are meaningful here. `limit_except GET` also
            # admits HEAD; everything else is denied before it reaches a file.
            limit_except GET {
                deny all;
            }
        }

        # Directory listings are off and unknown paths 404; the document root
        # itself is never enumerated.
        location / {
            limit_except GET {
                deny all;
            }
            try_files $uri =404;
        }
    }
}
